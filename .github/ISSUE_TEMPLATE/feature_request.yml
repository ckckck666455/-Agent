name: Feature request
description: 提议一个新能力
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么业务问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Agent 编排
        - 工具/ERP
        - RAG
        - 情绪/转人工
        - 评测
        - 前端/运营后台
        - 部署/稳定性
        - 文档
  - type: textarea
    id: tests
    attributes:
      label: 怎么验证
      description: 新增哪些测试/评测 case？
